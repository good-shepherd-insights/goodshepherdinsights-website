# Site Configuration
[site]
  title            = "" # CMS-owned in Sanity siteGlobals.seoDefaults
  description      = "" # CMS-owned in Sanity siteGlobals.seoDefaults
  tagline          = "" # CMS-owned in Sanity siteGlobals.seoDefaults
  taglineSeparator = "" # default is " - " 
  baseUrl          = "" # CMS-owned in Sanity siteGlobals.seoDefaults
  logo             = "" # CMS-owned in Sanity siteGlobals.brand
  logoAlternate    = "" # CMS-owned in Sanity siteGlobals.brand
  logoText         = "" # Text displayed next to the logo
  logoWidth        = "320px" # Width of the logo
  logoHeight       = "75px" # Height of the logo

  # Add a trailing slash at the end of URLs (e.g., https://example.com/, https://example.com/contact/)˝
  # Note: Manually restart your server when you change this value
  trailingSlash = true

  # Add your site logo in image path below and generate favicons for different devices and platforms (https://realfavicongenerator.net/checker)
  [site.favicon]
    path  = "/images/favicons" # favicon images path (No need to change it)
    image = "" # CMS-owned in Sanity siteGlobals.seoDefaults


# SEO Metadata
# Specific SEO configurations that complement the general site settings.
# -----------------------------------------------------------------------------------------------------------------------------------
[seo]
  author = "" # CMS-owned in Sanity siteGlobals.seoDefaults
  keywords = []
  robots = "" # CMS-owned in Sanity siteGlobals.seoDefaults

  [seo.robotsTxt]
    enable   = true # Enables or disables robots.txt file generation on site build
    disallow = [] # Disallow specific paths (e.g., "/_astro/", "/cdn-cgi/")

  [seo.sitemap]
    enable  = true # Enables or disables sitemap generation on site build
    exclude = ["case-studies", "team", "pricing", "category", "tag", "404"] # exclude all pages that include these folder names

  [seo.organization]
    streetAddress = ""
    addressLocality = ""
    addressRegion = ""
    email = ""
    telephone = ""
    logo = ""


# Different theme settings
# -----------------------------------------------------------------------------------------------------------------------------------
[settings]
  # If you change value of any of the following three, make sure to change the folder name also from
  # - "src/content" folder
  # - "src/[...lang]/pages" folder
  # - "src/content.config.ts" collection object
  blogFolder        = "blog" # Folder where blog posts are stored
  serviceFolder     = "services" # Folder where services are stored
  caseStudiesFolder = "case-studies" # Folder where case-studies/projects are stored
  testimonialFolder = "testimonial" # Folder where testimonial/reviews are stored
  teamFolder        = "team" # Folder where team members are stored

  pagination             = 6 # Number of posts displayed on each page blog list page
  stickyHeader           = true # Enables scroll-aware sticky behavior (e.g., hide on scroll down), not applicable to fixed headers
  pageHeaderDefaultImage = "" # CMS-owned in Sanity siteGlobals.seoDefaults

  # CMS-owned in Sanity siteGlobals.forms.
  contactFormAction = ""
  contactFormProvider = ""

  footerDescription = ""

  [settings.copyright]
    enable = true
    text   = ""

  # Mailchimp Subscription Form located in footer
  [settings.subscription]
    enable            = true # Enables or disable the subscription form
    title             = ""
    note              = ""
    formAction        = ""
    mailchimpTagValue = ""

  # Multilingual settings (check src/config/language.json for changing the languages)
  # NOTE: Manually restart your server when you change the following multilingual table values
  [settings.multilingual]
    # Set `enable` to `true` for enabling the multilingual feature or `false` for disabling it.
    # Remove multilingual content files after disabling the feature.
    enable               = true
    defaultLanguage      = "en"
    disableLanguages     = ["fr"] # List of languages to disable (eg: ["fr", "es"])
    showDefaultLangInUrl = false # Show default language in URL (eg: https://getastrothemes.com/en/)

  # Global Contact Information
  [settings.contactInfo]
    address = ""
    email   = ""
    phone   = ""
    mapLink = ""

  # Header Offcanvas Configuration
  [settings.headerOffcanvas]
    enable      = true
    logo        = ""
    description = ""

    # Call To Action Button
    [settings.headerOffcanvas.button]
      enable = true
      label  = ""
      url    = "/contact/"

# Navigation Button In Header
[settings.navigationButton]
  enable = true
  label  = ""
  url    = "/contact/"

# Announcement bar in HeaderTwo topbar
[settings.announcementBar]
  enable = true
  label  = ""

[settings.markup.tableOfContents]
  enable     = false
  expanded   = false # whether to expand the table of contents by default
  endLevel   = 5
  ordered    = false
  startLevel = 1


# OpenGraph Metadata
# Specific OpenGraph settings, using values from the [site] section where possible.
# -----------------------------------------------------------------------------------------------------------------------------------
[opengraph]
  image       = "" # CMS-owned in Sanity siteGlobals.seoDefaults
  ogLocale    = ""
  ogType      = ""
  twitter     = ""
  twitterCard = ""

# [head] (Add custom scripts, stylesheets, and meta tags to be rendered in the <head> section of the page)
# -----------------------------------------------------------------------------------------------------------------------------------
[head]
  content = """
  """
